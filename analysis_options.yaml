# This file was missing entirely from the project - `flutter_lints` was
# declared as a dev_dependency in pubspec.yaml, but with no
# analysis_options.yaml to enable it, `flutter analyze` was only ever
# running Dart's bare default lints. Several comments throughout the
# codebase (e.g. in the document_detection detectors) explicitly say
# "verify this against `flutter analyze`" - none of those were actually
# being checked by anything until this file existed.
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # The codebase consistently favors small, well-commented public API
    # docs on the "why", not blanket doc-comment coverage - not enabling
    # `public_member_api_docs` here to avoid a wall of low-value warnings
    # on every getter/field.
    prefer_single_quotes: true
